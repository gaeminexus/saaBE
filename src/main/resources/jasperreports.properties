# =====================================================================
# COMPILADOR DE EXPRESIONES — LEER ANTES DE TOCAR ESTA LINEA
# =====================================================================
# EN JASPERREPORTS 7.0.3 NO HAY NINGUN COMPILADOR QUE FUNCIONE EN RUNTIME
# DENTRO DE WILDFLY, Y ESTA LINEA NO LO ARREGLA. Verificado el 2026-08-25
# listando el contenido de los jar desplegados:
#
#   - JRJaninoCompiler  NO EXISTE en 7.0.3. Janino se retiro del producto.
#     Que janino este en el pom y en WEB-INF/lib no cambia nada: la clase
#     que lo usaria no esta.
#   - JRJdtCompiler     NO EXISTE en el jar principal. En 7.x el JDT se
#     movio al artefacto aparte jasperreports-jdt, que NO esta en el pom.
#   - Lo unico que trae el jar es JRJavacCompiler y JRJdk13Compiler, los
#     dos con compilador EXTERNO, sin acceso al classloader del deployment.
#
# Asi que las dos configuraciones que ha tenido este archivo nombraban
# clases inexistentes, y las dos daban el mismo error cambiando solo el
# nombre: "Could not instantiate report compiler".
#
# LA SOLUCION NO ES ESTA PROPIEDAD: ES QUE EL .jasper EXISTA.
# ReporteServiceImpl:110 busca /rep/{modulo}/{nombre}.jasper y solo cae al
# .jrxml si no lo encuentra. Con el .jasper puesto, esta linea no se
# ejecuta nunca. Ver CLAUDE.md, seccion de Reportes.
#
# QUE PASO EN AGOSTO DE 2026, porque explica por que aparecio ahora y no
# antes: cnt, crd, cxc, tsr y test siempre tuvieron su .jasper junto al
# .jrxml. Los SIETE reportes de rhh se anadieron con .jrxml solamente, asi
# que eran los unicos que llegaban a la compilacion en runtime. No fue una
# regresion de configuracion: fue un paso que faltaba al anadirlos.
#
# SI ALGUN DIA HACE FALTA EL RESPALDO EN RUNTIME, la via es anadir
# net.sf.jasperreports:jasperreports-jdt al pom y apuntar esta propiedad a
# su clase — no inventar otro nombre. Hasta entonces se deja como esta:
# inofensiva porque no se alcanza, y documentada para que nadie vuelva a
# perder una tarde cambiandole el nombre.
# =====================================================================
net.sf.jasperreports.compiler.class=net.sf.jasperreports.engine.design.JRJaninoCompiler

# Desactiva la cache de reportes compilados en disco para evitar conflictos
net.sf.jasperreports.compiler.keep.java.file=false

# Modo de exportacion PDF
net.sf.jasperreports.export.pdf.version=1.6

services:
  oracle-23ai:
    image: container-registry.oracle.com/database/free:latest
    container_name: saa-oracle-23ai
    ports:
      - "1521:1521"     # Listener
      - "5500:5500"     # Enterprise Manager Express
    environment:
      ORACLE_PWD: saa123   # Contraseña para SYS, SYSTEM y PDBADMIN
    volumes:
      - oracle23ai-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD-SHELL", "echo 'SELECT 1 FROM DUAL;' | sqlplus -S sys/saa123@localhost:1521/FREEPDB1 as sysdba"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  oracle23ai-data: